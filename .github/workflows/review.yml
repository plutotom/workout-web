name: Review checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main, staging]
  workflow_dispatch:

# These tests use isolated fixtures and need no application credentials.
permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  watch-native:
    name: Watch native lifecycle
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:ios
      - run: pnpm test:watch-native

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  offline-accounts:
    # Stable name: required by the repository's merge ruleset.
    name: Offline account lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:offline-accounts
