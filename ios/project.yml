name: GrayedLift

options:
  bundleIdPrefix: com.isaiahproctor.workout
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

packages:
  GrayedCore:
    path: Packages/GrayedCore
  GrayedStore:
    path: Packages/GrayedStore
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    from: 1.7.5

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 3CVY7K9AJ6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GrayedLift:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: GrayedLift
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: Grayed Lift
        PRODUCT_MODULE_NAME: GrayedLift
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahproctor.workout.local
        INFOPLIST_FILE: GrayedLift/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: GrayedCore
      - package: GrayedStore
      - package: Clerk
        product: ClerkKit

  GrayedLiftWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: GrayedLiftWatch
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Grayed Lift Watch
        PRODUCT_MODULE_NAME: GrayedLiftWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahproctor.workout.local.watchkitapp
        INFOPLIST_FILE: GrayedLiftWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO

schemes:
  GrayedLift:
    build:
      targets:
        GrayedLift: all
    run:
      config: Debug
    archive:
      config: Release

  GrayedLiftWatch:
    build:
      targets:
        GrayedLiftWatch: all
    run:
      config: Debug
    archive:
      config: Release
