# Single-package app: root is the only workspace member.
# allowBuilds is pnpm 11's replacement for onlyBuiltDependencies / ignoredBuiltDependencies.
packages:
  - "."
  - "mobile"

allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: false
  unrs-resolver: false

overrides:
  brace-expansion@<1.1.16: 1.1.16
  brace-expansion@>=3.0.0 <5.0.7: 5.0.7
  "@hono/node-server@<2.0.10": 2.0.10
  fast-uri@>=3.0.0 <=3.1.3: 3.1.4
  js-yaml@>=4.0.0 <4.3.0: 4.3.0
  postcss@<=8.5.11: 8.5.12
  sharp@<0.35.0: 0.35.2
